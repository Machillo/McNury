name: Bootstrap Mac Nury

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified project files
        shell: bash
        run: |
          base64 -d > /tmp/mcnury-bootstrap.tar.gz <<'MCNURY_ARCHIVE'

MCNURY_ARCHIVE
          tar -xzf /tmp/mcnury-bootstrap.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: create initial Mac Nury ordering platform"
          git push
